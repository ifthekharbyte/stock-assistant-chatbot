<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1300" height="900" fill="#ffffff"/>

  <text x="650" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Stock Market Assistant — architecture</text>

  <!-- connectors (drawn first, so boxes sit on top) -->
  <g stroke="#475569" stroke-width="1.6" fill="none">
    <path d="M 180 110 L 180 190" marker-end="url(#arrow)"/>
    <path d="M 180 260 L 560 480" marker-end="url(#arrow)"/>
    <path d="M 410 480 L 190 410" marker-end="url(#arrow)"/>
    <path d="M 320 375 L 600 235" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M 600 210 L 300 105" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M 840 210 L 1000 105" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M 480 270 L 480 330" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M 595 365 L 630 260" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M 720 260 L 570 480" marker-end="url(#arrow)"/>
    <path d="M 850 260 L 900 330" marker-end="url(#arrow)"/>
    <path d="M 880 400 L 700 480" marker-end="url(#arrow)"/>
    <path d="M 470 410 L 445 480" marker-end="url(#arrow)"/>
    <path d="M 560 570 L 610 630" marker-end="url(#arrow)"/>
  </g>

  <!-- edge labels -->
  <g font-size="12" fill="#334155">
    <text x="188" y="150">pulls overviews + news</text>
    <text x="150" y="304">writes documents</text>
    <text x="300" y="440">loaded at startup</text>
    <text x="420" y="330" transform="rotate(-27 420 330)">search tool call</text>
    <text x="450" y="157" transform="rotate(-20 450 157)">live tool calls</text>
    <text x="920" y="157" transform="rotate(-33 920 157)">LLM calls</text>
    <text x="645" y="355">logs conversation</text>
    <text x="880" y="290">scores each answer</text>
    <text x="770" y="435">writes feedback</text>
    <text x="490" y="450">user feedback</text>
    <text x="600" y="605">reads all tables</text>
  </g>

  <!-- external services -->
  <g>
    <rect x="60" y="40" width="240" height="70" rx="10" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.4"/>
    <text x="180" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Massive Stock API</text>
    <text x="180" y="90" text-anchor="middle" font-size="12" fill="#475569">live prices, news, fundamentals</text>
  </g>

  <g>
    <rect x="1000" y="40" width="240" height="70" rx="10" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.4"/>
    <text x="1120" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Groq</text>
    <text x="1120" y="90" text-anchor="middle" font-size="12" fill="#475569">openai/gpt-oss-120b</text>
  </g>

  <!-- ingestion -->
  <g>
    <rect x="60" y="190" width="240" height="70" rx="10" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.4"/>
    <text x="180" y="220" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">ingest_kb.py</text>
    <text x="180" y="240" text-anchor="middle" font-size="12" fill="#475569">scheduled ingestion</text>
  </g>

  <!-- runtime -->
  <g>
    <rect x="600" y="190" width="240" height="70" rx="10" fill="#dcfce7" stroke="#4ade80" stroke-width="1.4"/>
    <text x="720" y="220" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">agent.py</text>
    <text x="720" y="240" text-anchor="middle" font-size="12" fill="#475569">tool-calling loop</text>
  </g>

  <g>
    <rect x="60" y="330" width="260" height="80" rx="10" fill="#dcfce7" stroke="#4ade80" stroke-width="1.4"/>
    <text x="190" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">knowledge_base.py</text>
    <text x="190" y="382" text-anchor="middle" font-size="12" fill="#475569">keyword + vector + hybrid</text>
  </g>

  <g>
    <rect x="370" y="220" width="220" height="50" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="480" y="250" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">User</text>
  </g>

  <g>
    <rect x="370" y="330" width="220" height="80" rx="10" fill="#dcfce7" stroke="#4ade80" stroke-width="1.4"/>
    <text x="480" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">app.py</text>
    <text x="480" y="382" text-anchor="middle" font-size="12" fill="#475569">Streamlit chat</text>
  </g>

  <g>
    <rect x="860" y="330" width="220" height="70" rx="10" fill="#dcfce7" stroke="#4ade80" stroke-width="1.4"/>
    <text x="970" y="360" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">judge.py</text>
    <text x="970" y="380" text-anchor="middle" font-size="12" fill="#475569">LLM-as-judge</text>
  </g>

  <!-- data store -->
  <g>
    <rect x="370" y="480" width="380" height="90" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.4"/>
    <text x="560" y="512" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Postgres</text>
    <text x="560" y="534" text-anchor="middle" font-size="12" fill="#78350f">documents · conversations · feedback</text>
    <text x="560" y="554" text-anchor="middle" font-size="12" fill="#78350f">(db_documents / db_save / db_feedback)</text>
  </g>

  <!-- monitoring -->
  <g>
    <rect x="480" y="630" width="280" height="80" rx="10" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.4"/>
    <text x="620" y="662" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">dashboard.py / Grafana</text>
    <text x="620" y="682" text-anchor="middle" font-size="12" fill="#4c1d95">monitoring</text>
  </g>

  <!-- legend -->
  <g font-size="12" fill="#334155">
    <rect x="60" y="800" width="16" height="16" fill="#eef2f7" stroke="#94a3b8"/>
    <text x="84" y="813">external API</text>
    <rect x="200" y="800" width="16" height="16" fill="#e0f2fe" stroke="#38bdf8"/>
    <text x="224" y="813">ingestion</text>
    <rect x="330" y="800" width="16" height="16" fill="#dcfce7" stroke="#4ade80"/>
    <text x="354" y="813">application</text>
    <rect x="470" y="800" width="16" height="16" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="494" y="813">data store</text>
    <rect x="600" y="800" width="16" height="16" fill="#ede9fe" stroke="#a78bfa"/>
    <text x="624" y="813">monitoring</text>
  </g>
</svg>
