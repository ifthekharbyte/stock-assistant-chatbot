services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stock_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - postgres

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB:-stock_assistant}
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - MASSIVE_API_KEY=${MASSIVE_API_KEY}
      - MODEL_NAME=${MODEL_NAME:-openai/gpt-oss-120b}
    ports:
      - "8501:8501"
    depends_on:
      - postgres

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    command: streamlit run monitoring/dashboard.py --server.port=8502 --server.address=0.0.0.0
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB:-stock_assistant}
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
    ports:
      - "8502:8502"
    depends_on:
      - postgres

volumes:
  postgres_data:
  grafana_data:
